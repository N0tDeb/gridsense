name: GridSense checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install -e . --no-deps
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Linux full verification
        if: runner.os == 'Linux'
        run: python scripts/verify.py --output-dir var/ci-verification
      - name: Windows operational compatibility (native evidence remains platform-bound)
        if: runner.os == 'Windows'
        run: python scripts/verify.py --windows-compat --output-dir var/ci-verification
      - name: Linux source release packaging smoke
        if: runner.os == 'Linux'
        run: |
          python scripts/package_release.py --verification-dir var/ci-verification --output var/ci-package/GridSense.zip
          python -c "import zipfile; z = zipfile.ZipFile('var/ci-package/GridSense.zip'); assert z.testzip() is None; assert 'gridsense/RELEASE_MANIFEST.json' in z.namelist()"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.os }}
          if-no-files-found: error
          path: |
            var/ci-verification/
            frontend/test-results/
